# Træk det fulde skema ud af produktion, så historikken kan gøres komplet.
#
# HVORFOR: supabase/migrations/ opretter kun 19 af de 42 tabeller i produktion.
# De øvrige 23 — heriblandt profiles, matches, match_results og elo_history —
# blev lavet i hånden før historikken begyndte 16. april. En database bygget
# fra migrations alene mangler derfor halvdelen af skemaet, og Supabase'
# preview-branches fejler med `relation "matches" does not exist`.
#
# HVAD DEN GØR: kører `supabase db dump` med projektets egen adgangsnøgle og
# lægger resultatet op som en artefakt. Den ændrer INTET — hverken i repoet
# eller i databasen. Udtrækket skal læses igennem af et menneske, før det
# bliver til en baseline-migration.
#
# HVORFOR IKKE AUTOMATISK: en baseline-migration ville af `supabase db push`
# blive opfattet som ny og forsøgt KØRT på produktion. Den skal først markeres
# som allerede anvendt (`supabase migration repair --status applied`). Den
# rækkefølge skal en person tage stilling til — derfor kun manuel start.

name: Dump produktionsskema (baseline)

on:
  workflow_dispatch:

# Kun skrive-adgang til grene. Workflowen opretter ikke PR'er - det maa
# GitHub Actions ikke i dette repo, og det er en fornuftig default.
permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Træk skemaet ud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Mangler GitHub-secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          PROJECT_REF="${{ vars.SUPABASE_PROJECT_REF }}"
          PROJECT_REF="${PROJECT_REF:-hzmrsqrerkoftcppfklu}"
          echo "Trækker skema fra ${PROJECT_REF}"

          mkdir -p dump
          npx supabase@latest link --project-ref "${PROJECT_REF}" --yes

          # Skemaet: tabeller, typer, constraints, indekser, funktioner.
          npx supabase@latest db dump --linked -f dump/schema.sql

          # Rettigheder og RLS-politikker ligger separat.
          npx supabase@latest db dump --linked --role-only -f dump/roles.sql || \
            echo "::warning::roles-dump fejlede — ikke kritisk"

      - name: Opsummér hvad der kom ud
        run: |
          set -euo pipefail
          echo "## Udtrukket skema" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | Antal |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in dump/*.sql; do
            [ -f "$f" ] || continue
            echo "| \`$(basename "$f")\` — linjer | $(wc -l < "$f") |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "| CREATE TABLE | $(grep -c '^CREATE TABLE' dump/schema.sql || echo 0) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CREATE FUNCTION | $(grep -ci 'CREATE OR REPLACE FUNCTION\|^CREATE FUNCTION' dump/schema.sql || echo 0) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CREATE POLICY | $(grep -c '^CREATE POLICY' dump/schema.sql || echo 0) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CREATE INDEX | $(grep -c 'CREATE.*INDEX' dump/schema.sql || echo 0) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Læg udtrækket op som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: produktionsskema
          path: dump/
          retention-days: 7

      # Udtrækket placeres som en baseline-migration med version 0, så den
      # sorterer FØR alle eksisterende migrations. En frisk database bygger
      # derefter skemaet først og lægger de 150 migrations oven på.
      #
      # PR'en åbnes som UDKAST og må ikke merges, før baseline er markeret som
      # allerede anvendt i produktion. Ellers ser `supabase db push` den som ny
      # og kører CREATE TABLE mod en database der har tabellerne i forvejen.
      - name: Skub baseline-migrationen til en gren
        run: |
          set -euo pipefail
          MIG="supabase/migrations/00000000000000_baseline_schema.sql"
          GREN="schema-baseline/$(date -u +%Y%m%d-%H%M%S)"

          mkdir -p supabase/migrations
          {
            echo "-- BASELINE: produktionsskemaet pr. $(date -u +%Y-%m-%d)."
            echo "--"
            echo "-- Genereret af .github/workflows/dump-schema-baseline.yml med"
            echo "-- \`supabase db dump\`. Rediger ikke i haanden - koer workflowen igen."
            echo "--"
            echo "-- Findes FOER alle andre migrations (version 0), saa en frisk database"
            echo "-- bygger skemaet foerst. Produktionen har indholdet i forvejen; derfor"
            echo "-- skal denne version markeres som allerede anvendt med"
            echo "-- \`supabase migration repair --status applied 00000000000000\`"
            echo "-- FOER den bliver merget."
            echo ""
            cat dump/schema.sql
          } > "$MIG"

          # Baseline foerer tabellerne og funktionerne ind i historikken, saa
          # SQL-indekset skal regenereres - ellers fejler db:sql-index:check.
          # At de "manglende" lister skrumper er netop beviset paa at det virker.
          npm ci --prefer-offline --no-audit --fund=false
          npm run db:sql-index

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$GREN"
          git add "$MIG" supabase/sql/INDEX.md
          git commit -m "chore(db): baseline af produktionsskemaet (genereret)"
          git push -u origin "$GREN"

          # GitHub Actions maa ikke oprette PR'er her (Settings -> Actions ->
          # "Allow GitHub Actions to create and approve pull requests" er slaaet
          # fra, hvilket er en fornuftig default). Grenen er skubbet; PR'en
          # oprettes udefra.
          {
            echo "## Baseline er klar paa en gren"
            echo ""
            echo "**Gren:** \`$GREN\`"
            echo ""
            echo "| | Antal |"
            echo "|---|---|"
            echo "| CREATE TABLE | $(grep -c 'CREATE TABLE' "$MIG") |"
            echo "| CREATE FUNCTION | $(grep -c 'CREATE OR REPLACE FUNCTION\|CREATE FUNCTION' "$MIG") |"
            echo "| CREATE POLICY | $(grep -c 'CREATE POLICY' "$MIG") |"
            echo "| CREATE INDEX | $(grep -c 'CREATE INDEX\|CREATE UNIQUE INDEX' "$MIG") |"
            echo ""
            echo "[Opret PR](https://github.com/${GITHUB_REPOSITORY}/compare/main...${GREN}?expand=1) - **maa ikke merges**, foer versionen er markeret som allerede anvendt."
          } >> "$GITHUB_STEP_SUMMARY"
