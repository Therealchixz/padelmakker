# Træk det fulde skema ud af produktion, så historikken kan gøres komplet.
#
# HVORFOR: supabase/migrations/ opretter kun 19 af de 42 tabeller i produktion.
# De øvrige 23 — heriblandt profiles, matches, match_results og elo_history —
# blev lavet i hånden før historikken begyndte 16. april. En database bygget
# fra migrations alene mangler derfor halvdelen af skemaet, og Supabase'
# preview-branches fejler med `relation "matches" does not exist`.
#
# HVAD DEN GØR: kører `supabase db dump` med projektets egen adgangsnøgle og
# lægger resultatet op som en artefakt. Den ændrer INTET — hverken i repoet
# eller i databasen. Udtrækket skal læses igennem af et menneske, før det
# bliver til en baseline-migration.
#
# HVORFOR IKKE AUTOMATISK: en baseline-migration ville af `supabase db push`
# blive opfattet som ny og forsøgt KØRT på produktion. Den skal først markeres
# som allerede anvendt (`supabase migration repair --status applied`). Den
# rækkefølge skal en person tage stilling til — derfor kun manuel start.

name: Dump produktionsskema (baseline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Træk skemaet ud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Mangler GitHub-secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          PROJECT_REF="${{ vars.SUPABASE_PROJECT_REF }}"
          PROJECT_REF="${PROJECT_REF:-hzmrsqrerkoftcppfklu}"
          echo "Trækker skema fra ${PROJECT_REF}"

          mkdir -p dump
          npx supabase@latest link --project-ref "${PROJECT_REF}" --yes

          # Skemaet: tabeller, typer, constraints, indekser, funktioner.
          npx supabase@latest db dump --linked -f dump/schema.sql

          # Rettigheder og RLS-politikker ligger separat.
          npx supabase@latest db dump --linked --role-only -f dump/roles.sql || \
            echo "::warning::roles-dump fejlede — ikke kritisk"

      - name: Opsummér hvad der kom ud
        run: |
          set -euo pipefail
          echo "## Udtrukket skema" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | Antal |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in dump/*.sql; do
            [ -f "$f" ] || continue
            echo "| \`$(basename "$f")\` — linjer | $(wc -l < "$f") |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "| CREATE TABLE | $(grep -c '^CREATE TABLE' dump/schema.sql || echo 0) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CREATE FUNCTION | $(grep -ci 'CREATE OR REPLACE FUNCTION\|^CREATE FUNCTION' dump/schema.sql || echo 0) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CREATE POLICY | $(grep -c '^CREATE POLICY' dump/schema.sql || echo 0) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CREATE INDEX | $(grep -c 'CREATE.*INDEX' dump/schema.sql || echo 0) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Læg udtrækket op som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: produktionsskema
          path: dump/
          retention-days: 7
