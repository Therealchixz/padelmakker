# Alarm når noget fejler efter merge.
#
# Baggrund: apply-supabase-migrations kørte og fejlede efter hver merge til main
# fra 27. august til 19. september uden at nogen opdagede det. Workflows der
# kører EFTER merge har ingen tilskuer — der er ingen PR at gøre rød.
#
# Denne workflow åbner et issue når en af dem fejler. Et issue er synligt i
# repoet og sender mail til ejeren, så fejlen ikke kan stå ubemærket i ugevis.
#
# Er der allerede et åbent issue for samme workflow, kommenteres der på det i
# stedet for at oprette et nyt — ellers ville en vedvarende fejl fylde repoet.

name: Alarm ved fejl efter merge

on:
  workflow_run:
    workflows:
      - Apply Supabase migrations
      - Deploy Supabase Functions
      - CI
      - E2E Playwright
    types:
      - completed

permissions:
  issues: write

jobs:
  alarm:
    # Kun fejl, og kun på main — PR-fejl ses i selve PR'en.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Opret eller opdatér issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const markoer = `<!-- deploy-alarm:${run.name} -->`;
            const titel = `🚨 "${run.name}" fejlede på main`;

            const krop = [
              markoer,
              `**${run.name}** fejlede efter en ændring på \`main\`.`,
              '',
              `| | |`,
              `|---|---|`,
              `| Commit | \`${run.head_sha.slice(0, 7)}\` |`,
              `| Tidspunkt | ${run.updated_at} |`,
              `| Log | [se kørslen](${run.html_url}) |`,
              '',
              'Denne slags fejl har ingen tilskuer — der er ingen pull request at',
              'gøre rød. Derfor dette issue.',
              '',
              'Luk det når fejlen er rettet.',
            ].join('\n');

            const aabne = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const eksisterende = aabne.data.find((i) => (i.body || '').includes(markoer));

            if (eksisterende) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: eksisterende.number,
                body: `Fejlede igen på \`${run.head_sha.slice(0, 7)}\` — [log](${run.html_url}).`,
              });
              core.notice(`Kommenterede på eksisterende issue #${eksisterende.number}`);
            } else {
              const nyt = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titel,
                body: krop,
              });
              core.notice(`Oprettede issue #${nyt.data.number}`);
            }
